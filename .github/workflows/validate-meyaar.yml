name: Validate Meyaar JavaScript

on:
  push:
    branches:
      - "fix/**"
      - "finance/**"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check Meyaar-main/Meyar/js/app.js
      - name: Test financial calculations
        run: node tests/financial-core.test.cjs
