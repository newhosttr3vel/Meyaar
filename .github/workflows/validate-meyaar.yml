name: Validate Meyaar

on:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
      - "fix/**"
      - "finance/**"
      - "design/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate syntax and financial regression tests
        run: npm run validate
